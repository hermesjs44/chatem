import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// Exact Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyBJMRBWEbLmjTjmMRUCLspfu6wp_zZoyk4",
  authDomain: "chatweb-fc1c1.firebaseapp.com",
  projectId: "chatweb-fc1c1",
  storageBucket: "chatweb-fc1c1.firebasestorage.app",
  messagingSenderId: "198864419928",
  appId: "1:198864419928:web:cb82967f7bbaa262311e2d"
};

const appId = typeof __app_id !== 'undefined' ? __app_id : 'chatweb-fc1c1-prod';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const customToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

async function initFirebaseAuth() {
    if (customToken) {
        try {
            await signInWithCustomToken(auth, customToken);
        } catch (err) {
            try { await signInAnonymously(auth); } catch (anonErr) {}
        }
    } else {
        try {
            await signInAnonymously(auth);
        } catch (anonErr) {}
    }
}

initFirebaseAuth();

// Expose globally for React code
window.fb = { db, auth, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query, limit, appId };
</script>

const DEFAULT_USERS = [
    { id: 'usr_hermes', username: "hermes", passwordHash: "Hjs2154", role: "Diseñador", name: "Hermes (Diseñador System)" },
    { id: 'usr_marta', username: "marta_admin", passwordHash: "Admin123", role: "Administrativo", name: "Marta Gómez" },

    { id: 'usr_lucia', username: "lucia_atencion", passwordHash: "Atencion123", role: "Atención al público", name: "Lucía Fernández" }
];

function App() {
    // --- AUTHENTICATION PERSISTENT STATE ---
    // Default to Guest immediately if no user stored
    const [currentUser, setCurrentUser] = useState(() => {
        try {
            const saved = localStorage.getItem('chat_app_session_v3');
            return saved ? JSON.parse(saved) : { role: 'Cliente', name: 'Usuario Invitado', isGuest: true };
        } catch(e) { 
            return { role: 'Cliente', name: 'Usuario Invitado', isGuest: true }; 
        }

    // Hidden Operator Login Modal
    const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
    const [authTab, setAuthTab] = useState('staff'); // 'staff', 'designer', 'login'
    
    const [loginDni, setLoginDni] = useState('');
    const [loginEmail, setLoginEmail] = useState('');
    const [loginName, setLoginName] = useState('');
    const [designerUser, setDesignerUser] = useState('');
    const [designerPass, setDesignerPass] = useState('');
    const [selectedStaffId, setSelectedStaffId] = useState('');
    const [staffPassInput, setStaffPassInput] = useState('');
    const [loginError, setLoginError] = useState('');
    
    // Password toggles
    const [showDesignerPass, setShowDesignerPass] = useState(false);
    const [showStaffPass, setShowStaffPass] = useState(false);
    const [showNewUserPass, setShowNewUserPass] = useState(false);

    // --- REALTIME FIREBASE STATES ---
    const [chatbotNodes, setChatbotNodes] = useState(DEFAULT_CHATBOT_NODES);
    const [systemUsers, setSystemUsers] = useState(DEFAULT_USERS);
    const [clientMessages, setClientMessages] = useState([]);
    const [internalMessages, setInternalMessages] = useState([]);
    const [fbConnected, setFbConnected] = useState(false);

    // Active Navigation
    const [activeTab, setActiveTab] = useState('client'); // 'client', 'internal', 'admin'
    const [designerSubTab, setDesignerSubTab] = useState('editor'); // 'editor', 'users'

    // Bot Flow Builder
    const [selectedNodeId, setSelectedNodeId] = useState('start');
    const [editingNode, setEditingNode] = useState(null);
    const [toastMessage, setToastMessage] = useState('');

    // Chat states
    const [assignedOperator, setAssignedOperator] = useState(null);
    const [isBotActive, setIsBotActive] = useState(true);
    const [inputClientMsg, setInputClientMsg] = useState('');
    const [clientImagePreview, setClientImagePreview] = useState(null);

    // Internal Chat states
    const [internalInput, setInternalInput] = useState('');
    const [internalImagePreview, setInternalImagePreview] = useState(null);

    // Lightbox image state
    const [lightboxImg, setLightboxImg] = useState(null);

    // Password visibility in admin panel list
    const [revealedPasswords, setRevealedPasswords] = useState({});

    // New User Registration Form in Admin Panel
    const [newUserForm, setNewUserForm] = useState({
        username: '',
        name: '',
        password: '',
        role: 'Atención al público'
    });

    const chatEndRef = useRef(null);
    const internalEndRef = useRef(null);

    // Check if user is staff
    const isStaff = currentUser && currentUser.role !== 'Cliente';

    // Helper Toast
    const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
    };

    useEffect(() => {
        let unsubBot = () => {};
        let unsubUsers = () => {};
        let unsubClientMsgs = () => {};
        let unsubInternalMsgs = () => {};

        const setupSubscriptions = () => {
            if (!window.fb || !window.fb.db) {
                setTimeout(setupSubscriptions, 250);
                return;
            }

            const { db, doc, collection, onSnapshot, setDoc, appId } = window.fb;
            setFbConnected(true);

            // 1. Chatbot Nodes Tree Listener
            const botDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'chatbot_config', 'tree_v3');
            unsubBot = onSnapshot(botDocRef, (snap) => {
                if (snap.exists() && snap.data().nodes) {
                    setChatbotNodes(snap.data().nodes);
                } else {
                    setDoc(botDocRef, { nodes: DEFAULT_CHATBOT_NODES }).catch(e => {
                        setChatbotNodes(DEFAULT_CHATBOT_NODES);
                    });
                }
            }, err => {
                setChatbotNodes(DEFAULT_CHATBOT_NODES);
            });

            // 2. System Staff Users Listener
            const usersCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'system_users_v3');
            unsubUsers = onSnapshot(usersCollRef, (snap) => {
                if (!snap.empty) {
                    const list = [];
                    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                    setSystemUsers(list);
                } else {
                    DEFAULT_USERS.forEach(u => {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system_users_v3', u.id), u).catch(e => {});
                    });
                }
            }, err => {
                setSystemUsers(DEFAULT_USERS);
            });

            // 3. Client Messages Listener
            const clientCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'client_chat_messages_v3');
            unsubClientMsgs = onSnapshot(clientCollRef, (snap) => {
                const msgs = [];
                snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                setClientMessages(msgs);
            }, err => {});

            // 4. Internal Private Messages Listener
            const internalCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'internal_chat_messages_v3');
            unsubInternalMsgs = onSnapshot(internalCollRef, (snap) => {
                const msgs = [];
                snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                setInternalMessages(msgs);
            }, err => {});
        };

        setupSubscriptions();

        return () => {
            unsubBot();
            unsubUsers();
            unsubClientMsgs();
            unsubInternalMsgs();
        };
    }, []);

    // Initial greeting in client chat EXACTLY ONCE
    useEffect(() => {
        if (clientMessages.length === 0 && chatbotNodes.start) {
            const initialWelcomeMsg = {
                id: 'init_welcome_start',
                sender: 'bot',
                text: chatbotNodes.start.text,
                options: chatbotNodes.start.options,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                createdAt: Date.now()
            };

            if (window.fb && window.fb.db) {
                const { db, collection, addDoc, appId } = window.fb;
                addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'client_chat_messages_v3'), initialWelcomeMsg)
                    .catch(() => setClientMessages([initialWelcomeMsg]));
            } else {
                setClientMessages([initialWelcomeMsg]);
            }
        }
    }, [chatbotNodes]);

    // Keep node editor in sync
    useEffect(() => {
        if (chatbotNodes[selectedNodeId]) {
            setEditingNode(JSON.parse(JSON.stringify(chatbotNodes[selectedNodeId])));
        } else if (chatbotNodes['start']) {
            setSelectedNodeId('start');
            setEditingNode(JSON.parse(JSON.stringify(chatbotNodes['start'])));
        }
    }, [selectedNodeId, chatbotNodes]);

    // Auto-scroll
    useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [clientMessages]);

    useEffect(() => {
        internalEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [internalMessages]);

    // LOGIN & AUTHENTICATION HANDLERS
    const saveSession = (userObj) => {
        try {
            localStorage.setItem('chat_app_session_v3', JSON.stringify(userObj));
        } catch(e) {}
        setCurrentUser(userObj);
        setLoginError('');
        setIsLoginModalOpen(false);
    };

    const handleRegisteredSubmit = (e) => {
        e.preventDefault();
        if (!loginDni.trim() || !loginEmail.trim() || !loginName.trim()) {
            setLoginError('Todos los campos son obligatorios.');
            return;
        }
        saveSession({
            role: 'Cliente',
            dni: loginDni.trim(),
            email: loginEmail.trim(),
            name: loginName.trim(),
            isGuest: false
        });
        setActiveTab('client');
    };

    const handleDesignerSubmit = (e) => {
        e.preventDefault();
        if (designerUser === 'hermes' && designerPass === 'Hjs2154') {
            saveSession({
                role: 'Diseñador',
                username: 'hermes',
                name: 'Hermes (Diseñador System)',
                isGuest: false
            });
            setActiveTab('admin');
        } else {
            setLoginError('Usuario o contraseña de Diseñador incorrectos.');
        }
    };

    const handleStaffSubmit = (e) => {
        e.preventDefault();
        const found = systemUsers.find(u => u.id === selectedStaffId);
        if (!found) {
            setLoginError('Selecciona un usuario válido.');
            return;
        }
        if (found.passwordHash && staffPassInput !== found.passwordHash) {
            setLoginError('Contraseña de usuario incorrecta.');
            return;
        }
        saveSession({
            role: found.role,
            username: found.username,
            name: found.name,
            isGuest: false
        });
        setActiveTab('internal');
    };

    const handleLogout = () => {
        const guestUser = { role: 'Cliente', name: 'Usuario Invitado', isGuest: true };
        try { localStorage.setItem('chat_app_session_v3', JSON.stringify(guestUser)); } catch(e) {}
        setCurrentUser(guestUser);
        setActiveTab('client');
        setLoginError('');
    };

    const handleOptionClick = async (option) => {
        const now = Date.now();
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const userMsg = {
            id: `msg_${now}`,
            sender: 'user',
            text: option.label,
            time: timeStr,
            createdAt: now
        };

        if (window.fb && window.fb.db) {

            });
        } else {
            setClientMessages(prev => [...prev, userMsg]);

            setIsBotActive(false);

                id: `sys_${now+1}`,
                sender: 'system',
                text: `🔄 Derivando a un representante en línea del área de **${option.deriveTo}**...`,
                time: timeStr,
                createdAt: now + 1

                id: `op_${now+2}`,
                sender: 'operator',
                operatorName: activeOp.name,
                operatorRole: activeOp.role,
                text: `¡Hola ${currentUser?.name || ''}! Soy ${activeOp.name} del departamento de ${option.deriveTo}. ¿Cómo puedo ayudarte hoy?`,
                time: timeStr,
                createdAt: now + 2
            };

            // MODIFICACIÓN: Si es invitado, NO guardar en Firebase Firestore
            if (!currentUser?.isGuest && window.fb && window.fb.db) {
                const { db, collection, addDoc, appId } = window.fb;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'client_chat_messages_v3');
                addDoc(colRef, sysMsg).catch(() => setClientMessages(prev => [...prev, sysMsg]));
                addDoc(colRef, opMsg).catch(() => setClientMessages(prev => [...prev, opMsg]));
            } else {
                setClientMessages(prev => [...prev, sysMsg, opMsg]);
            }

        } else if (option.next && chatbotNodes[option.next]) {
            const nextNode = chatbotNodes[option.next];
            const botReply = {
                id: `bot_${now+1}`,
                sender: 'bot',
                text: nextNode.text,
                options: nextNode.options,
                time: timeStr,
                createdAt: now + 1
            };

            // MODIFICACIÓN: Si es invitado, NO guardar en Firebase Firestore
            if (!currentUser?.isGuest && window.fb && window.fb.db) {
                const { db, collection, addDoc, appId } = window.fb;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'client_chat_messages_v3');
                addDoc(colRef, botReply).catch(() => setClientMessages(prev => [...prev, botReply]));
            } else {
                setClientMessages(prev => [...prev, botReply]);
            }

                                                className="w-full px-3.5 py-2.5 bg-slate-50 border border-sky-100 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-purple-400">
                                                <option value="Administrativo">💼 Administrativo</option>
                                                <option value="Reclamos">🚨 Reclamos</option>
                                                <option value="Atención al público">👥 Atención al público</option>
                                            </select>
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="w-full py-3.5 btn-3d-purple text-white font-bold rounded-2xl text-xs uppercase tracking-wider">
                                            Guardar en Firestore
                                        </button>
                                    </form>
                                </div>

                                {/* Users List with Masked Passwords */}
                                <div className="bg-white p-6 rounded-3xl shadow-lg border border-sky-100">
                                    <h3 className="font-extrabold text-sm text-slate-900 mb-4">
                                        👥 Lista de Personal ({systemUsers.length})
                                    </h3>

                                    <div className="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                                        {systemUsers.map((u) => {
                                            const isRevealed = !!revealedPasswords[u.id];
                                            return (
                                                <div key={u.id} className="p-3.5 border border-sky-100 bg-sky-50/50 rounded-2xl flex items-center justify-between">
                                                    <div>
                                                        <p className="font-extrabold text-xs text-slate-800">{u.name}</p>
                                                        <p className="text-[10px] text-slate-500 font-mono">@{u.username}</p>
                                                        
                                                        {/* Masked Password Display */}
                                                        <div className="flex items-center space-x-1.5 mt-1 text-[10px] text-slate-500 font-mono">
                                                            <span>Clave:</span>
                                                            <span className="text-purple-600 font-bold">
                                                                {isRevealed ? (u.passwordHash || '••••••••') : '••••••••'}
                                                            </span>
                                                            <button 
                                                                type="button"
                                                                onClick={() => togglePasswordMask(u.id)}
                                                                className="text-slate-400 hover:text-slate-600 ml-1">
                                                                <EyeIcon show={isRevealed} />
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <span className={`text-[9px] px-3 py-1 rounded-full font-bold uppercase tracking-wider border ${
                                                        u.role === 'Diseñador' ? 'bg-purple-100 text-purple-700 border-purple-200' :
                                                        u.role === 'Administrativo' ? 'bg-blue-100 text-blue-700 border-blue-200' :
                                                        u.role === 'Reclamos' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200'
                                                    }`}>
                                                        {u.role}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                )}

            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
